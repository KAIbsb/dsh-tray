name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile dsh-tray.exe
        shell: pwsh
        run: |
          $fx = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319"
          & "$fx\csc.exe" /nologo /t:winexe /platform:anycpu /optimize+ `
            /win32icon:assets\whale-white.ico `
            /win32manifest:app.manifest `
            /resource:assets\whale-blue.png,whale-blue.png `
            /resource:assets\whale-dark.png,whale-dark.png `
            "/r:$fx\System.Drawing.dll" "/r:$fx\System.Windows.Forms.dll" `
            /out:dsh-tray.exe Program.cs Lang.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item dsh-tray.exe | Select-Object Name, Length

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dsh-tray.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  dsh-tray.exe" | Set-Content -Encoding ascii dsh-tray.exe.sha256
          Get-Content dsh-tray.exe.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dsh-tray.exe
            dsh-tray.exe.sha256
          generate_release_notes: true
