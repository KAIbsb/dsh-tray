name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile dsh-tray.exe
        shell: pwsh
        run: |
          $fx = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319"
          & "$fx\csc.exe" "@dsh-tray.rsp"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item dsh-tray.exe | Select-Object Name, Length

      - name: Headless self-check
        shell: pwsh
        run: |
          .\dsh-tray.exe --smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\dsh-tray.exe --menu-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\dsh-tray.exe --find-window
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\dsh-tray.exe --ui-preview
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $smoke = Get-Content -Raw smoke-result.txt
          $menu = Get-Content -Raw menu-test.txt
          if ($smoke -notmatch 'SMOKE OK') { Write-Error 'smoke check failed'; exit 1 }
          if ($menu -notmatch 'menu-test OK') { Write-Error 'menu-test check failed'; exit 1 }
          Write-Host 'headless self-check OK'

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dsh-tray.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  dsh-tray.exe" | Set-Content -Encoding ascii dsh-tray.exe.sha256
          Get-Content dsh-tray.exe.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dsh-tray.exe
            dsh-tray.exe.sha256
          generate_release_notes: true
